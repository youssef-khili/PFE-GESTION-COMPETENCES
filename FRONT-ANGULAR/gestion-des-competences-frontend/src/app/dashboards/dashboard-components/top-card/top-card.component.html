<mat-card>
  <mat-card-content class="filter-content">
    <div fxLayout="row">

      <div fxFlex class="m-r-5" *ngIf="connectedUserRole !== 'MANAGER'">
        <mat-form-field appearance="outline">
          <mat-label>Department</mat-label>
          <mat-select [(ngModel)]="selectedDepartment">
            <mat-option>--</mat-option>
            <mat-option *ngFor="let department of departments" [value]="department.id">
              {{department.name}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div fxFlex="30"  class="m-r-5">
        <mat-form-field appearance="outline">
          <mat-label>User</mat-label>
          <mat-select [(ngModel)]="selectedUsers" >
            <mat-option>--</mat-option>
            <mat-option *ngFor="let user of users"
                        [value]="user.id" >
              {{user.fullname}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div fxFlex="30"  class="m-r-5">
        <form [formGroup]="selectedSkills">
          <mat-form-field appearance="outline">
            <mat-label>Skills</mat-label>
            <mat-select placeholder="User Type" formControlName="skills" multiple>
              <mat-option #allSelected (click)="toggleAllSelection()" [value]="0">All</mat-option>
              <mat-option *ngFor="let skill of skills" [value]="skill.id" (click)="tosslePerOne(allSelected.viewValue)">
                {{skill.name}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </form>
      </div>
      <div fxFlex="20" >
        <button pButton pRipple label="Apply Filter" (click)="applyFilter()" class="p-button-info p-mr-2"></button>
      </div>


    </div>

  </mat-card-content>
</mat-card>
